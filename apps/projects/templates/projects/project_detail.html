<h1>{{ project.title }}</h1>

<p>{{ project.description }}</p>
<p>Budget: {{ project.budget }}</p>
<p>Category: {{ project.category }}</p>
<p>Client: {{ project.client.user.username }}</p>

<hr>

{% if project.is_open %}
    <button disabled>Send Proposal</button>
{% else %}
    <p>Project closed</p>
{% endif %}
